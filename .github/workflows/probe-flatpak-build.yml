# Probe: step 1 of the Flatpak pipeline on a real runner. Builds a dummy app
# into an unsigned repository and packs it with ci/flatpak-collect.sh.
name: Probe flatpak build
run-name: Probe flatpak build ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version of the dummy app, like 1.2.3
        type: string
        required: true

permissions: {}

jobs:
  build:
    name: Build the unsigned repository
    runs-on: ubuntu-24.04
    permissions:
      contents: read # fetch the scripts of this commit
    steps:
      - name: Fetch the scripts at the commit of this run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir repo && gh api "repos/$GITHUB_REPOSITORY/tarball/$GITHUB_SHA" | tar -xz --strip-components=1 -C repo

      - name: Install flatpak
        run: |
          set -euo pipefail
          sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends flatpak ostree
          flatpak --version && ostree --version | head -n 2

      - name: Build and collect
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          repo/sandbox/flatpak/build-dummy.sh "$VERSION" "$RUNNER_TEMP/src" "$RUNNER_TEMP/flatpak-repo"
          repo/sandbox/flatpak/module/ci/flatpak-collect.sh "$RUNNER_TEMP/flatpak-repo" out
          tar -xOf out/flatpak-to-sign.tar refs.txt

      - name: Upload flatpak-to-sign.tar
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flatpak-to-sign
          path: out/flatpak-to-sign.tar
          if-no-files-found: error

      - name: Upload flatpak-repo.tar
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flatpak-repo
          path: out/flatpak-repo.tar
          if-no-files-found: error
