# Step 1 of the release pipeline: build every release file with no secret.
#
# create-release.yml starts this workflow on the default branch when a release
# pull request is merged; a maintainer can also start it there by hand with the
# release tag. It always builds the commit of this run. It creates the draft release
# at that commit, builds the GUI and the CLI binaries through the reusable
# build workflows, and writes an attested build manifest.
#
# Step 2: `just sign-release <tag>` on the machine of a maintainer.
# Step 3: finalize-release.yml verifies the signatures and publishes.
#
# dev-scripts/release/config.json names this file (build_workflow). The
# signing script checks that the attestation of the build manifest comes from
# this file, so the manifest job must stay in this file.
name: Build release
run-name: Build release ${{ inputs.tag }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example 1.2.3 (the app version in src-tauri/tauri.conf.json, optionally with a leading v)
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: build-release-tag-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  check:
    name: Check the tag and the app version
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The signing script refuses a tag that is not a semantic version, or
      # that differs from the app version at the release commit, and a build
      # run that did not run on the default branch. This check fails before
      # the long build instead.
      - name: Check the tag
        env:
          TAG: ${{ inputs.tag }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          # shellcheck source=/dev/null
          . dev-scripts/release/lib.sh
          [ "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH" ] ||
            die "This workflow runs on $GITHUB_REF. Start it on the default branch $DEFAULT_BRANCH."
          valid_tag "$TAG" || die "Invalid tag: '$TAG'"
          set_release_version "$TAG"
          app_version="$(jq -er .version src-tauri/tauri.conf.json)"
          [ "$app_version" = "$RELEASE_VERSION" ] ||
            die "The app version in src-tauri/tauri.conf.json at $GITHUB_SHA is $app_version, but the tag $TAG names version $RELEASE_VERSION."
          echo "Tag $TAG, version $RELEASE_VERSION, commit $GITHUB_SHA."

  draft-release:
    name: Create or update the draft release
    needs: check
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write # create or update the draft release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The release notes are the section of CHANGELOG.md for this version at
      # the built commit. The signing script copies them into latest.json, and
      # the update dialog of the app shows them.
      - name: Extract the release notes from CHANGELOG.md
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          # shellcheck source=/dev/null
          . dev-scripts/release/lib.sh
          set_release_version "$TAG"
          # The lines after the heading "## [<version>]" up to the next "## "
          # heading, without leading blank lines. The command substitution
          # drops trailing blank lines.
          notes="$(awk -v h="## [$RELEASE_VERSION]" '
            index($0, "## ") == 1 { if (f) exit; f = (index($0, h) == 1); next }
            f
          ' CHANGELOG.md | sed '/./,$!d')"
          if [ -z "${notes//[[:space:]]/}" ]; then
            echo "::error file=CHANGELOG.md::CHANGELOG.md at $GITHUB_SHA has no section '## [$RELEASE_VERSION]', or the section is empty. Add the release notes for $RELEASE_VERSION and build again."
            exit 1
          fi
          printf '%s\n' "$notes" >"$RUNNER_TEMP/release-notes.md"
          echo "Release notes for $RELEASE_VERSION:"
          cat "$RUNNER_TEMP/release-notes.md"

      - name: Create the draft release or update the existing one
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          notes_file="$RUNNER_TEMP/release-notes.md"
          matches="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            | jq -s --arg tag "$TAG" '[.[][] | select(.tag_name == $tag)]')"
          count="$(jq 'length' <<<"$matches")"
          if [ "$count" -eq 0 ]; then
            gh release create "$TAG" --draft --target "$GITHUB_SHA" --title "$TAG" --notes-file "$notes_file"
            echo "Created draft release $TAG at $GITHUB_SHA."
            exit 0
          fi
          if [ "$count" -ne 1 ]; then
            echo "::error::Found $count releases with tag $TAG. Expected at most one."
            exit 1
          fi
          draft="$(jq -r '.[0].draft' <<<"$matches")"
          target="$(jq -r '.[0].target_commitish' <<<"$matches")"
          id="$(jq -r '.[0].id' <<<"$matches")"
          if [ "$draft" != "true" ]; then
            echo "::error::Release $TAG exists and is not a draft. Refusing to build into it."
            exit 1
          fi
          if [ "$target" != "$GITHUB_SHA" ]; then
            echo "::error::Draft release $TAG targets '$target', but this run builds $GITHUB_SHA."
            exit 1
          fi
          # Update the notes by release ID: a draft has no Git tag yet.
          jq -n --rawfile body "$notes_file" '{body: $body}' \
            | gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$id" --input - >/dev/null
          echo "Draft release $TAG already exists at $GITHUB_SHA. Updated its release notes. Continuing."

  gui:
    name: GUI
    needs: draft-release
    permissions:
      contents: read
    uses: $/.github/workflows/build-gui-release-binaries.yml
    with:
      tag: ${{ inputs.tag }}
      flatpak: true

  cli:
    name: CLI
    needs: draft-release
    permissions:
      contents: read
    uses: $/.github/workflows/build-release-binaries.yml
    with:
      tag: ${{ inputs.tag }}

  manifest:
    name: Build manifest
    needs: [gui, cli]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      id-token: write # sign the attestation
      attestations: write # store the attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # build-manifest.sh needs both groups of dev-scripts/release/config.json:
      # artifact_pattern (release-*, what the signer downloads) and
      # ci_artifact_pattern (ci-*, flatpak-repo.tar). Each artifact goes into
      # its own subdirectory of artifacts/.
      - name: Download the release artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: artifacts

      - name: Download the CI artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ci-*
          path: artifacts

      - name: Build the manifest
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          ./dev-scripts/release/build-manifest.sh --artifacts artifacts --out manifest --tag "$TAG"

      - name: Attest the manifest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: manifest/BUILD-SHA256SUMS

      - name: Attest every file in the manifest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: manifest/BUILD-SHA256SUMS

      # The name is BUILD_MANIFEST_ARTIFACT in dev-scripts/release/lib.sh. It
      # matches release-*, so the signer downloads it with the build files.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-build-manifest
          path: manifest/
          if-no-files-found: error
