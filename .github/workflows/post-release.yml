# A release that GITHUB_TOKEN publishes fires no `release` event. The
# finalize workflow starts this workflow directly to prove that a follow-up
# workflow still runs after publishing.
name: Post release
run-name: Post release ${{ inputs.tag }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag of the published release
        type: string
        required: true

permissions: {}

jobs:
  announce:
    name: Announce the release
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Print the release
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          echo "Release $TAG is published."
